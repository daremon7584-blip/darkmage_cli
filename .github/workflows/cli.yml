name: CLI

on:
  push:
    branches: [main, "stream/**"]
    paths:
      - "darkmage_cli/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.lock"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "darkmage_cli/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.lock"
      - ".github/workflows/cli.yml"

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install CLI (no dependency resolution)
        run: python -m pip install --no-deps -e .
      - name: Version contract
        run: |
          darkmage --version
          python -m darkmage_cli.cli --version
          python -c "import darkmage_cli; print(darkmage_cli.__version__)"
      - name: Run tests
        run: python -m pytest -q

  wheel:
    name: build wheel and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install wheel in a clean venv
        run: |
          python -m venv /tmp/darkmage-wheel-venv
          /tmp/darkmage-wheel-venv/bin/pip install --require-hashes -r requirements.lock
          /tmp/darkmage-wheel-venv/bin/pip install --no-deps dist/*.whl
          /tmp/darkmage-wheel-venv/bin/darkmage --version
          /tmp/darkmage-wheel-venv/bin/darkmage --help >/dev/null
