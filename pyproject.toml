[project]
name = "darkmage-cli"
dynamic = ["version"]
description = "Custom CLI for the Darkmage AI platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "websockets>=15.0",
    "textual>=8,<9",
    "cryptography>=42",
]

[project.scripts]
darkmage = "darkmage_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "darkmage_cli/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
