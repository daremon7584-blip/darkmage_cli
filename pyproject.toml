[project]
name = "odyssey-cli"
version = "0.1.0"
description = "Custom CLI for the Odyssey AI platform"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "websockets>=15.0",
    "textual>=0.79",
]

[project.scripts]
odyssey = "odyssey_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
